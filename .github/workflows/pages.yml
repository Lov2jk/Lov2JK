name: Deploy JK Chennai to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Import JK Chennai bulk products"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build customer catalog from easy Admin product entries
        run: node scripts/build_product_catalog.mjs
      - name: Prepare simple Admin lists
        run: node scripts/sync_admin_lists.mjs
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize storefront images
        run: python scripts/optimize_images.py
      - name: Generate sitemap and Merchant feed
        run: python scripts/generate_catalog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
