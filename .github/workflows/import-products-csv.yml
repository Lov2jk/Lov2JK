name: Import JK Chennai bulk products
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action payload
        required: false
        type: string
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/import_products_csv.mjs imports/products-bulk.json
      - run: node scripts/build_product_catalog.mjs
      - run: node scripts/sync_admin_lists.mjs
      - name: Save validated import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/products content/products.json content/stock.json content/variant-stock.json content/prices.json content/visibility.json content/reviews.json content/checklist.json
          if git diff --cached --quiet; then
            echo "No product changes to save."
            exit 0
          fi
          git commit -m "Import product catalog from owner bulk rows"
          git push
