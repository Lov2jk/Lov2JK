media:
  input: assets/images/products
  output: assets/images/products

content:
  - name: categories
    label: Categories & subcategories
    type: collection
    path: content/categories
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields: [name, parent, visible, order]
      sort: order
      order: asc
    fields:
      - {name: name, label: Category name, type: string, required: true}
      - name: slug
        label: Category URL name
        type: string
        required: true
        description: Lowercase words joined with hyphens, for example ladies-office-wear. Do not change this after assigning products.
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and hyphens only.
      - name: parent
        label: Parent category
        type: reference
        description: Leave empty for a main category such as Dresses or Toys. Choose Dresses, Ladies or Kids when creating a subcategory.
        options:
          collection: categories
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - {name: description, label: Short description, type: text}
      - {name: image, label: Category image, type: image}
      - name: order
        label: Display order
        type: number
        required: true
        default: 10
        description: Smaller numbers appear first.
      - name: visible
        label: Show on website
        type: boolean
        default: true
        description: Turn this off to prepare a future category without showing it to customers.

  - name: catalog
    label: Product catalog
    type: file
    path: content/products.json
    format: json
    operations:
      delete: false
    actions:
      - name: duplicate-product
        label: Duplicate product
        workflow: duplicate-product.yml
        ref: current
        cancelable: false
        confirm:
          title: Duplicate a product?
          message: The new copy will be hidden, unfeatured and set to zero stock until you finish editing it.
          button: Create safe copy
        fields:
          - name: sourceSku
            label: Existing product SKU to copy
            type: text
            required: true
          - name: newName
            label: New product name
            type: text
            required: true
          - name: newSku
            label: New unique SKU
            type: text
            required: true
          - name: newSlug
            label: New URL slug
            type: text
            required: true
    fields:
      - name: products
        label: Products
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {sku}"
        fields:
          - name: name
            label: Product name
            type: string
            required: true
          - name: stock
            label: Starting stock quantity
            type: number
            required: true
            description: Set this when adding a new product. Use Quick stock update for later changes.
          - name: slug
            label: URL slug
            type: string
            required: true
            description: Lowercase words joined with hyphens, for example pink-party-dress.
            pattern:
              regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              message: Use lowercase letters, numbers and hyphens only.
          - name: description
            label: Description
            type: text
            required: true
          - name: price
            label: Starting regular price
            type: number
            required: true
            description: Set this when adding a new product. Use Quick price update for later changes.
          - name: offerPrice
            label: Starting offer price
            type: number
          - name: sku
            label: SKU
            type: string
            required: true
          - name: category
            label: Category
            type: reference
            required: true
            description: Choose the most specific category. The product will automatically appear in all parent categories too.
            options:
              collection: categories
              search: "name,slug,parent"
              value: "{fields.slug}"
              label: "{fields.name}"
          - name: colors
            label: Colours
            type: string
            list: true
          - name: sizes
            label: Sizes
            type: string
            list: true
          - name: variants
            label: Colour and size stock variants
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{sku} — {color} / {size} — {stock}"
            description: Optional but recommended. Add one row for every sellable colour and size combination.
            fields:
              - {name: sku, label: Variant SKU, type: string, required: true}
              - {name: color, label: Colour, type: string}
              - {name: size, label: Size, type: string}
              - {name: stock, label: Stock quantity, type: number, required: true, default: 0}
          - name: ageGroup
            label: Age group
            type: string
          - name: images
            label: Product images
            type: image
            list: true
            description: The first image is the catalog cover. JPG, PNG, WebP and animated GIF images are supported.
          - name: imageFit
            label: Product image display
            type: select
            options:
              values: [cover, contain]
            description: Cover automatically fills and crops the frame. Contain shows the complete image without cropping.
          - name: imagePosition
            label: Product image crop position
            type: select
            options:
              values: [center, top, bottom, left, right]
            description: Choose which part of the image remains visible when Cover is selected.
          - {name: slideshowEnabled, label: Automatically move product images, type: boolean, default: true}
          - name: slideSeconds
            label: Seconds between product images
            type: number
            default: 4
            description: Recommended value is 4. This is used when the product has more than one image.
          - name: videoUrl
            label: Product video URL
            type: string
            description: Optional. Paste a YouTube link or a direct public MP4/WebM video URL.
          - name: videoPoster
            label: Product video cover image
            type: image
            description: Optional preview image shown before a direct video starts.
          - {name: material, label: Material or product details, type: text}
          - {name: care, label: Care or safety instructions, type: text}
          - {name: measurements, label: Measurements and fit notes, type: text}
          - {name: included, label: What is included, type: text}
          - {name: deliveryInfo, label: Product delivery information, type: text}
          - {name: returnInfo, label: Product return information, type: text}
          - {name: safetyInfo, label: Toy safety or garment warnings, type: text}
          - name: sizeGuide
            label: Size guide
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{size}"
            description: Optional for dresses. Add the actual garment measurements for each available size.
            fields:
              - {name: size, label: Size, type: string, required: true}
              - {name: chest, label: Chest, type: string}
              - {name: waist, label: Waist, type: string}
              - {name: length, label: Length, type: string}
          - name: featured
            label: Show on homepage
            type: boolean

  - name: quick_stock
    label: Quick stock update
    type: file
    path: content/stock.json
    format: json
    operations:
      delete: false
    fields:
      - name: products
        label: Stock quantities
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {sku}"
        description: Open a product, change only its stock quantity, and save.
        fields:
          - {name: name, label: Product name, type: string, hidden: true}
          - {name: slug, label: Product reference, type: string, hidden: true}
          - {name: sku, label: SKU number, type: string, readonly: true}
          - name: stock
            label: Stock quantity
            type: number
            required: true
            description: Set this to 0 when sold out. The website availability changes automatically.

  - name: quick_prices
    label: Quick price update
    type: file
    path: content/prices.json
    format: json
    operations:
      delete: false
    fields:
      - name: products
        label: Product prices
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {sku}"
        description: Change regular and offer prices here. Leave offer price empty when there is no discount.
        fields:
          - {name: name, label: Product name, type: string, hidden: true}
          - {name: slug, label: Product reference, type: string, hidden: true}
          - {name: sku, label: SKU number, type: string, readonly: true}
          - {name: price, label: Regular price, type: number, required: true}
          - {name: offerPrice, label: Offer price, type: number}

  - name: quick_variant_stock
    label: Quick colour-size stock
    type: file
    path: content/variant-stock.json
    format: json
    operations:
      delete: false
    fields:
      - name: variants
        label: Variant stock quantities
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{sku} — {color} / {size}"
        description: Change only the stock quantity for each colour and size SKU.
        fields:
          - {name: product, label: Product, type: string, readonly: true}
          - {name: productSlug, label: Product reference, type: string, hidden: true}
          - {name: sku, label: Variant SKU, type: string, readonly: true}
          - {name: color, label: Colour, type: string, readonly: true}
          - {name: size, label: Size, type: string, readonly: true}
          - {name: stock, label: Stock quantity, type: number, required: true}

  - name: product_visibility
    label: Show or hide products
    type: file
    path: content/visibility.json
    format: json
    operations:
      delete: false
    fields:
      - name: products
        label: Website visibility
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {sku}"
        description: Turn off Show on website to prepare or temporarily hide a product.
        fields:
          - {name: name, label: Product name, type: string, hidden: true}
          - {name: slug, label: Product reference, type: string, hidden: true}
          - {name: sku, label: SKU number, type: string, readonly: true}
          - {name: visible, label: Show on website, type: boolean}

  - name: customer_reviews
    label: Customer reviews
    type: file
    path: content/reviews.json
    format: json
    operations:
      delete: false
    fields:
      - name: products
        label: Reviews by product
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {sku}"
        description: Add only genuine reviews received from customers with permission.
        fields:
          - {name: name, label: Product name, type: string, hidden: true}
          - {name: slug, label: Product reference, type: string, hidden: true}
          - {name: sku, label: SKU number, type: string, readonly: true}
          - name: reviews
            label: Published reviews
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} — {rating}/5"
            fields:
              - {name: name, label: Customer name, type: string, required: true}
              - name: rating
                label: Star rating out of 5
                type: number
                required: true
                description: Enter a whole number from 1 to 5.
              - {name: text, label: Review, type: text, required: true}
              - {name: verified, label: Verified purchase, type: boolean}
              - {name: date, label: Review date, type: date}
              - {name: photo, label: Customer photo, type: image}
              - {name: approved, label: Approved for website, type: boolean, default: true}

  - name: order_tracking
    label: Customer order tracking
    type: file
    path: content/orders.json
    format: json
    operations:
      delete: false
    fields:
      - name: orders
        label: Published order statuses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{reference} — {status}"
        description: Add or update an order so the customer can check it on the Order status page. Do not include private address or payment information.
        fields:
          - {name: reference, label: Order reference, type: string, required: true}
          - name: status
            label: Current status
            type: select
            required: true
            options:
              values: [Received, Payment confirmed, Packed, Shipped, Delivered, Cancelled]
          - {name: message, label: Customer message, type: text}
          - {name: trackingUrl, label: Courier tracking link, type: string}
          - {name: updated, label: Last updated, type: datetime}

  - name: product_checklist
    label: Product checklist
    type: file
    path: content/checklist.json
    format: json
    operations:
      delete: false
    fields:
      - name: products
        label: Product setup status
        type: object
        readonly: true
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {status}"
        description: This report updates automatically after the Product catalog changes.
        fields:
          - {name: name, label: Product name, type: string}
          - {name: sku, label: SKU number, type: string}
          - {name: status, label: Status, type: string}
          - {name: issues, label: Checklist result, type: text}
          - {name: slug, label: Product reference, type: string, hidden: true}

  - name: homepage
    label: Homepage & promotions
    type: file
    path: content/settings.json
    format: json
    operations:
      delete: false
    fields:
      - {name: heroEyebrow, label: Homepage small heading, type: string}
      - {name: heroTitle, label: Homepage main heading, type: string}
      - {name: heroDescription, label: Homepage introduction, type: text}
      - name: googleSiteVerification
        label: Google Search Console verification code
        type: string
        description: Paste only the content value supplied by Google, not the complete meta tag.
      - {name: heroVisualEnabled, label: Show homepage hero visual, type: boolean}
      - name: heroImages
        label: Homepage hero slideshow images
        type: image
        list: true
        description: Add, remove and reorder images here.
      - {name: heroSlideshowEnabled, label: Automatically move homepage images, type: boolean}
      - {name: heroSlideSeconds, label: Seconds between homepage images, type: number}
      - {name: heroImageAlt, label: Hero image description, type: string}
      - name: heroImagePosition
        label: Hero image position
        type: select
        options:
          values: [center, top, bottom, left, right]
      - {name: heroCardEnabled, label: Show favourite card on hero image, type: boolean}
      - {name: heroCardEyebrow, label: Favourite card small heading, type: string}
      - {name: heroCardTitle, label: Favourite card title, type: string}
      - {name: heroCardText, label: Favourite card description, type: string}
      - {name: dressesCategoryImage, label: Dresses category image, type: image}
      - {name: dressesCategoryEyebrow, label: Dresses category small heading, type: string}
      - {name: dressesCategoryTitle, label: Dresses category title, type: string}
      - {name: toysCategoryImage, label: Toys category image, type: image}
      - {name: toysCategoryEyebrow, label: Toys category small heading, type: string}
      - {name: toysCategoryTitle, label: Toys category title, type: string}
      - name: promotion
        label: Advertisement popup
        type: object
        fields:
          - {name: enabled, label: Show advertisement popup, type: boolean}
          - {name: eyebrow, label: Small heading, type: string}
          - {name: title, label: Main offer heading, type: string}
          - {name: text, label: Offer or collection message, type: text}
          - {name: image, label: Advertisement image, type: image}
          - {name: videoUrl, label: Advertisement video URL, type: string}
          - {name: videoPoster, label: Video cover image, type: image}
          - {name: videoAutoplay, label: Autoplay video, type: boolean}
          - {name: videoMuted, label: Mute video, type: boolean}
          - {name: videoControls, label: Show video controls, type: boolean}
          - {name: buttonLabel, label: Button text, type: string}
          - {name: buttonUrl, label: Button destination, type: string}

  - name: order_status_messages
    label: Order status messages
    type: file
    path: content/settings.json
    format: json
    operations:
      delete: false
    fields:
      - name: orderStatuses
        label: WhatsApp order status templates
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        description: Edit the status names and messages used on the order tracking information page.
        fields:
          - {name: name, label: Status name, type: string, required: true}
          - {name: message, label: Customer message, type: text, required: true}

  - name: store
    label: Store settings
    type: file
    path: content/settings.json
    format: json
    operations:
      delete: false
    fields:
      - {name: storeName, label: Store name, type: string, required: true}
      - {name: tagline, label: Tagline, type: string}
      - name: siteUrl
        label: Public website URL
        type: string
        description: Keep the GitHub Pages URL until your custom domain is connected.
      - name: whatsapp
        label: WhatsApp number
        type: string
        description: Country code and number using digits only, for example 919363529266.
      - {name: email, label: Business email, type: string}
      - {name: upiId, label: UPI ID, type: string}
      - {name: paymentLink, label: Payment link, type: string}
      - {name: shippingNote, label: Top announcement, type: string}
      - {name: dispatchTime, label: Dispatch estimate, type: string}
      - {name: deliveryEstimate, label: Delivery estimate, type: string}
      - name: lowStockThreshold
        label: Low-stock warning quantity
        type: number
        description: Products at or below this quantity show an Only a few left message. Use 0 to disable the warning.
      - name: analyticsMeasurementId
        label: Google Analytics measurement ID
        type: string
        description: Optional. Paste an ID such as G-ABC123 after creating Google Analytics.
      - {name: instagram, label: Instagram URL, type: string}
      - {name: facebook, label: Facebook URL, type: string}
      - {name: youtube, label: YouTube URL, type: string}
      - name: business
        label: Public business details
        type: object
        fields:
          - {name: trademarkName, label: Brand name, type: string}
          - {name: proprietorName, label: Proprietor name, type: string}
          - {name: companyName, label: Company name, type: string}
          - {name: address, label: Business address, type: text}
          - {name: commencementDate, label: Business commencement date, type: string}
          - {name: nature, label: Nature of business, type: string}
      - name: marketplaces
        label: Online marketplaces
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - {name: name, label: Marketplace name, type: string, required: true}
          - name: url
            label: Public store or product URL
            type: string
            description: Paste the customer-facing Amazon, Flipkart or other store link.
          - {name: note, label: Short note, type: string}

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "Update JK Chennai content: {path}"
